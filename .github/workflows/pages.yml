name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'backend/**'
      - 'package.json'
      - 'scripts/check-static.mjs'
      - 'scripts/configure-ai.mjs'
      - 'scripts/configure-version.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application syntax
        run: |
          for file in dist/*.js dist/*.mjs; do node --check "$file"; done
      - name: Test application logic
        run: npm test
      - name: Check deployment files
        run: node scripts/check-static.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Configure public AI endpoint
        env:
          AI_API_BASE: ${{ vars.AI_API_BASE }}
        run: node scripts/configure-ai.mjs
      - name: Stamp public release version
        run: node scripts/configure-version.mjs
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

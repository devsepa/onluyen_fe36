name: Deploy AI backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'dist/explanation-data.mjs'
      - 'dist/library-data.mjs'
      - 'dist/bank-merge.mjs'
      - 'dist/resources.mjs'
      - 'dist/site-config.mjs'
      - 'scripts/check-gemini.mjs'
      - 'scripts/check-private-library.mjs'
      - 'scripts/check-explanation-cache.mjs'
      - '.github/workflows/ai-backend.yml'
permissions:
  contents: read
concurrency:
  group: ai-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Add CLOUDFLARE_API_TOKEN in repository Secrets.'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Add CLOUDFLARE_ACCOUNT_ID in repository Secrets.'; exit 1; }
          test -n "$GEMINI_KEY" || { echo 'Add GEMINI_API_KEY in repository Secrets.'; exit 1; }
      - name: Resolve available Gemini model
        run: node scripts/select-gemini-model.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Verify Gemini answers and structured explanations
        run: node scripts/check-gemini.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Deploy Worker and private Gemini key
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          wranglerVersion: '4.161.0'
          command: deploy --config wrangler.jsonc
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Verify private-library authentication and public catalog
        run: node scripts/check-private-library.mjs
        env:
          AI_API_BASE: ${{ vars.AI_API_BASE }}
      - name: Verify anonymous explanations and shared reuse
        run: node scripts/check-explanation-cache.mjs
        env:
          AI_API_BASE: ${{ vars.AI_API_BASE }}

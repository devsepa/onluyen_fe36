<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5 Mẫu Thiết Kế Toàn Diện: Màn Hình Thiết Lập & Làm Bài</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 99px; }

    /* Theme 1: Gamified Duolingo 3D button */
    .btn-3d {
      box-shadow: 0 4px 0 #059669;
      transition: all 0.1s ease;
    }
    .btn-3d:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #059669;
    }
    .btn-3d-indigo {
      box-shadow: 0 4px 0 #4338ca;
    }
    .btn-3d-indigo:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #4338ca;
    }

    /* Theme 4: Neon Cyberpunk */
    .neon-cyan {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(6, 182, 212, 0.2);
    }
    .neon-magenta {
      box-shadow: 0 0 15px rgba(217, 70, 239, 0.4), inset 0 0 10px rgba(217, 70, 239, 0.2);
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen p-3 md:p-6 custom-scroll antialiased">
  <div class="max-w-6xl mx-auto space-y-5">

    <!-- Top Navigation Header -->
    <header class="border-b border-slate-800 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs font-semibold uppercase tracking-wider mb-2">
          <span>🎨 BẢN THIẾT KẾ GIAO DIỆN TOÀN DIỆN</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">5 Mẫu Thiết Kế Giao Diện Slide Ôn Thi</h1>
        <p class="text-slate-400 text-sm mt-1">So sánh trực tiếp cả <strong>Màn hình Thiết lập</strong> và <strong>Màn hình Làm bài</strong> trên 5 ngôn ngữ thiết kế khác nhau.</p>
      </div>

      <!-- Controls: Screen View & Device Toggle -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Screen Toggle (Setup vs Quiz) -->
        <div class="flex items-center bg-slate-900 border border-slate-700/80 p-1 rounded-xl shadow-inner">
          <button id="tabSetup" onclick="switchScreen('setup')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm flex items-center gap-1.5">
            <span>⚙️ Màn hình Thiết lập</span>
          </button>
          <button id="tabQuiz" onclick="switchScreen('quiz')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5">
            <span>📝 Màn hình Làm bài</span>
          </button>
        </div>

        <!-- Device Toggle (Mobile vs Desktop) -->
        <div class="flex items-center bg-slate-900 border border-slate-800 p-1 rounded-xl">
          <button id="btnMobile" onclick="setDevice('mobile')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-slate-800 text-white shadow-sm flex items-center gap-1">
            <span>📱 Mobile</span>
          </button>
          <button id="btnDesktop" onclick="setDevice('desktop')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-white flex items-center gap-1">
            <span>💻 Desktop</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Concept Selector Pills -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
      <button onclick="selectConcept(1)" id="pill1" class="concept-pill p-3 rounded-2xl border text-left transition-all bg-indigo-600/20 border-indigo-500 shadow-md">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-lg">🎮</span>
          <span class="font-bold text-xs md:text-sm text-indigo-300">1. Gamified</span>
        </div>
        <p class="text-[11px] text-slate-400 line-clamp-1">Duolingo 3D · Nút khối nổi</p>
      </button>

      <button onclick="selectConcept(2)" id="pill2" class="concept-pill p-3 rounded-2xl border text-left transition-all bg-slate-900/80 border-slate-800 hover:border-slate-700">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-lg">🍎</span>
          <span class="font-bold text-xs md:text-sm text-slate-200">2. Apple Clean</span>
        </div>
        <p class="text-[11px] text-slate-400 line-clamp-1">Tối giản · Viền kính siêu mỏng</p>
      </button>

      <button onclick="selectConcept(3)" id="pill3" class="concept-pill p-3 rounded-2xl border text-left transition-all bg-slate-900/80 border-slate-800 hover:border-slate-700">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-lg">🎓</span>
          <span class="font-bold text-xs md:text-sm text-slate-200">3. Exam Pro</span>
        </div>
        <p class="text-[11px] text-slate-400 line-clamp-1">Khảo thí · Chuẩn Coursera/IELTS</p>
      </button>

      <button onclick="selectConcept(4)" id="pill4" class="concept-pill p-3 rounded-2xl border text-left transition-all bg-slate-900/80 border-slate-800 hover:border-slate-700">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-lg">⚡</span>
          <span class="font-bold text-xs md:text-sm text-slate-200">4. Cyberpunk</span>
        </div>
        <p class="text-[11px] text-slate-400 line-clamp-1">OLED Dark · Neon Glow viền</p>
      </button>

      <button onclick="selectConcept(5)" id="pill5" class="concept-pill p-3 rounded-2xl border text-left transition-all bg-slate-900/80 border-slate-800 hover:border-slate-700">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-lg">👍</span>
          <span class="font-bold text-xs md:text-sm text-slate-200">5. Thumb-First</span>
        </div>
        <p class="text-[11px] text-slate-400 line-clamp-1">Gọn 1 tay · Không khoảng đen</p>
      </button>
    </div>

    <!-- Active Concept Description Banner -->
    <div id="conceptBanner" class="p-4 rounded-2xl bg-slate-900/70 border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-3 text-xs text-slate-300">
      <!-- Injected by JS -->
    </div>

    <!-- Live Preview Stage Frame -->
    <div class="flex justify-center items-start py-2">
      <!-- Container changes width based on Mobile/Desktop mode -->
      <div id="deviceFrame" class="w-full max-w-sm transition-all duration-300 bg-[#0f172a] rounded-[36px] p-3 shadow-2xl border-4 border-slate-800 relative">
        <!-- Mobile Notch / Camera indicator -->
        <div id="mobileNotch" class="w-32 h-4 bg-slate-800 rounded-full mx-auto mb-2 opacity-70"></div>
        
        <!-- Screen Content Viewport -->
        <div id="screenViewport" class="min-h-[580px] flex flex-col transition-all">
          <!-- Dynamic Content Rendered Here -->
        </div>
      </div>
    </div>

  </div>

  <script>
    let currentConcept = 1;
    let currentScreen = 'setup'; // 'setup' | 'quiz'
    let currentDevice = 'mobile'; // 'mobile' | 'desktop'
    
    // Interactive State inside mockups
    let selectedMode = 'study'; // 'study' | 'exam'
    let selectedSubject = 'csdl';
    let questionCount = 20;
    let examMinutes = 30;
    let selectedAnswers = []; // for multi-select demonstration
    let singleAnswer = 'B';
    let showAiFeedback = true;

    const concepts = {
      1: {
        name: "Gamified EdTech (Duolingo Style)",
        tagline: "Học tập vui vẻ, nút bấm 3D nổi bật, màu sắc sinh động, kích thích động lực học tập.",
        highlights: "Thẻ chọn Ôn luyện / Thi thử minh họa hoạt hình, nút số câu dạng Badge nảy, phím A-B-C-D dạng phím bấm khối nổi nảy tay, feedback đúng/sai chúc mừng sinh động."
      },
      2: {
        name: "Minimalist Clean (Apple Dark Style)",
        tagline: "Tập trung cao độ, phẳng tuyệt đối, đường viền mờ 1px, không phân tâm.",
        highlights: "Segmented Control kính mờ, typography làm trung tâm, slide câu hỏi tràn viền tinh tế, các phím chọn dạng viên thuốc Pill thanh lịch."
      },
      3: {
        name: "Professional Exam Hub (Khảo thí & Học thuật)",
        tagline: "Bố cục thi cử nghiêm túc, hiển thị thông số chi tiết, chuẩn giao diện khảo thí.",
        highlights: "Thẻ cấu hình chia 2 cột rõ ràng, đồng hồ bấm giờ chuẩn mực, bảng danh sách câu hỏi dạng lưới số, thanh tiến độ chia vạch."
      },
      4: {
        name: "Cyberpunk OLED Neon (High-Tech HUD)",
        tagline: "Tông đen sâu tiết kiệm pin, viền phát sáng Neon Cyan & Magenta, cực ngầu.",
        highlights: "Chỉ số terminal công nghệ cao, nút BẮT ĐẦU phát sáng viền neon, phím A-B-C-D phản hồi ánh sáng khi chạm, card AI dạng Hacker Console."
      },
      5: {
        name: "Ergonomic Thumb-First (Tối ưu thao tác 1 tay trên điện thoại)",
        tagline: "Loại bỏ 100% khoảng trống thừa, toàn bộ nút bấm nằm gọn trong vùng với của ngón cái.",
        highlights: "Màn hình thiết lập cuộn mượt gọn trong 1 tầm nhìn, slide to trọn vẹn bề ngang màn hình, cụm phím A B C D gắn sát đáy màn hình cực dễ bấm."
      }
    };

    function selectConcept(id) {
      currentConcept = id;
      for (let i = 1; i <= 5; i++) {
        const pill = document.getElementById('pill' + i);
        if (i === id) {
          pill.className = "concept-pill p-3 rounded-2xl border text-left transition-all bg-indigo-600/20 border-indigo-500 shadow-md ring-1 ring-indigo-500/50";
        } else {
          pill.className = "concept-pill p-3 rounded-2xl border text-left transition-all bg-slate-900/80 border-slate-800 hover:border-slate-700";
        }
      }
      renderBanner();
      renderContent();
    }

    function switchScreen(screen) {
      currentScreen = screen;
      const tabSetup = document.getElementById('tabSetup');
      const tabQuiz = document.getElementById('tabQuiz');
      if (screen === 'setup') {
        tabSetup.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm flex items-center gap-1.5";
        tabQuiz.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5";
      } else {
        tabQuiz.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm flex items-center gap-1.5";
        tabSetup.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5";
      }
      renderContent();
    }

    function setDevice(device) {
      currentDevice = device;
      const frame = document.getElementById('deviceFrame');
      const notch = document.getElementById('mobileNotch');
      const btnMobile = document.getElementById('btnMobile');
      const btnDesktop = document.getElementById('btnDesktop');

      if (device === 'mobile') {
        frame.className = "w-full max-w-[390px] transition-all duration-300 bg-[#0f172a] rounded-[36px] p-3 shadow-2xl border-4 border-slate-800 relative";
        notch.style.display = 'block';
        btnMobile.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-slate-800 text-white shadow-sm flex items-center gap-1";
        btnDesktop.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-white flex items-center gap-1";
      } else {
        frame.className = "w-full max-w-[860px] transition-all duration-300 bg-[#0f172a] rounded-2xl p-5 shadow-2xl border-2 border-slate-800 relative";
        notch.style.display = 'none';
        btnDesktop.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-slate-800 text-white shadow-sm flex items-center gap-1";
        btnMobile.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-white flex items-center gap-1";
      }
      renderContent();
    }

    function renderBanner() {
      const c = concepts[currentConcept];
      document.getElementById('conceptBanner').innerHTML = `
        <div class="space-y-1">
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-sm text-indigo-400">Mẫu ${currentConcept}: ${c.name}</span>
          </div>
          <p class="text-slate-300 text-xs">${c.tagline}</p>
        </div>
        <div class="text-[11px] text-slate-400 bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700/60 max-w-md">
          <span class="text-indigo-300 font-semibold">Điểm nhấn:</span> ${c.highlights}
        </div>
      `;
    }

    // Toggle multi answers
    function toggleOption(key) {
      if (selectedAnswers.includes(key)) {
        selectedAnswers = selectedAnswers.filter(k => k !== key);
      } else {
        selectedAnswers.push(key);
      }
      renderContent();
    }

    function selectSingleOption(key) {
      singleAnswer = key;
      renderContent();
    }

    function setMode(mode) {
      selectedMode = mode;
      renderContent();
    }

    function setCount(cnt) {
      questionCount = cnt;
      renderContent();
    }

    // MAIN RENDER DISPATCHER
    function renderContent() {
      const vp = document.getElementById('screenViewport');
      if (currentScreen === 'setup') {
        renderSetupScreen(vp);
      } else {
        renderQuizScreen(vp);
      }
    }

    /* =========================================================================
       1. SETUP SCREEN IMPLEMENTATIONS (5 CONCEPTS)
       ========================================================================= */
    function renderSetupScreen(vp) {
      if (currentConcept === 1) {
        // GAMIFIED (Duolingo Style)
        vp.innerHTML = `
          <div class="space-y-4">
            <!-- Header -->
            <div class="text-center py-2">
              <span class="text-3xl">🚀</span>
              <h2 class="text-lg font-black text-white mt-1">Sẵn Sàng Chinh Phục!</h2>
              <p class="text-xs text-slate-400">Thiết lập buổi luyện đề để đạt điểm A+</p>
            </div>

            <!-- Mode Selector: Big 3D Cards -->
            <div class="grid grid-cols-2 gap-2.5">
              <div onclick="setMode('study')" class="p-3 rounded-2xl cursor-pointer transition-all border-2 ${selectedMode === 'study' ? 'bg-emerald-500/15 border-emerald-500 shadow-lg' : 'bg-slate-900 border-slate-800 opacity-70'}">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xl">📖</span>
                  ${selectedMode === 'study' ? '<span class="text-emerald-400 text-xs font-black">✓ ĐÃ CHỌN</span>' : ''}
                </div>
                <div class="font-bold text-xs text-white">Ôn Luyện</div>
                <div class="text-[10px] text-slate-400">Xem đáp án & AI giải thích ngay</div>
              </div>

              <div onclick="setMode('exam')" class="p-3 rounded-2xl cursor-pointer transition-all border-2 ${selectedMode === 'exam' ? 'bg-amber-500/15 border-amber-500 shadow-lg' : 'bg-slate-900 border-slate-800 opacity-70'}">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xl">⏱️</span>
                  ${selectedMode === 'exam' ? '<span class="text-amber-400 text-xs font-black">✓ ĐÃ CHỌN</span>' : ''}
                </div>
                <div class="font-bold text-xs text-white">Thi Thử</div>
                <div class="text-[10px] text-slate-400">Tính giờ áp lực, nộp bài tính điểm</div>
              </div>
            </div>

            <!-- Subject Card -->
            <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl space-y-1.5">
              <label class="text-[11px] font-bold text-slate-300 flex items-center gap-1.5">
                <span>📚 Môn Học & Đề Thi</span>
              </label>
              <select class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-2.5 text-xs font-medium focus:ring-2 focus:ring-emerald-500">
                <option>Cơ sở dữ liệu (Kho 240 câu hỏi)</option>
                <option>Kiến trúc máy tính (Kho 180 câu)</option>
                <option>Mạng máy tính (Kho 310 câu)</option>
              </select>
            </div>

            <!-- Question Count (Preset Badges) -->
            <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold text-slate-300">🎯 Số lượng câu hỏi</span>
                <span class="text-xs font-black text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">${questionCount} câu</span>
              </div>
              <div class="grid grid-cols-4 gap-1.5">
                ${[10, 20, 50, 240].map(cnt => `
                  <button onclick="setCount(${cnt})" class="py-2 rounded-xl text-xs font-bold transition-all ${questionCount === cnt ? 'bg-emerald-500 text-white shadow-md scale-105' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    ${cnt === 240 ? 'Tất cả' : cnt + ' câu'}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Big 3D Start Button -->
            <button onclick="switchScreen('quiz')" class="w-full py-3.5 rounded-2xl font-black text-sm text-white bg-emerald-500 hover:bg-emerald-400 btn-3d uppercase tracking-wider flex items-center justify-center gap-2 mt-4 shadow-xl">
              <span>Bắt Đầu Ngay</span>
              <span>⚡</span>
            </button>
          </div>
        `;
      }
      else if (currentConcept === 2) {
        // APPLE CLEAN
        vp.innerHTML = `
          <div class="space-y-5 max-w-lg mx-auto">
            <!-- Clean Header -->
            <div class="pt-2">
              <span class="text-[11px] uppercase tracking-widest text-slate-500 font-semibold">Cấu hình bài thi</span>
              <h2 class="text-xl font-semibold text-white tracking-tight">Thiết lập ôn tập</h2>
            </div>

            <!-- Apple Segmented Control -->
            <div class="bg-black/60 p-1 rounded-xl border border-white/10 flex">
              <button onclick="setMode('study')" class="flex-1 py-1.5 rounded-lg text-xs font-medium transition-all ${selectedMode === 'study' ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-400 hover:text-white'}">
                Ôn luyện tự do
              </button>
              <button onclick="setMode('exam')" class="flex-1 py-1.5 rounded-lg text-xs font-medium transition-all ${selectedMode === 'exam' ? 'bg-zinc-800 text-white shadow-sm' : 'text-zinc-400 hover:text-white'}">
                Thi thử tính giờ
              </button>
            </div>

            <!-- Subject Row -->
            <div class="p-3.5 rounded-2xl bg-zinc-900/60 border border-white/5 space-y-2">
              <div class="text-xs text-zinc-400">Học phần</div>
              <div class="flex items-center justify-between text-xs font-medium text-white">
                <span>Cơ sở dữ liệu (Database)</span>
                <span class="text-zinc-500 text-[11px]">240 câu hỏi ›</span>
              </div>
            </div>

            <!-- Sliders -->
            <div class="p-3.5 rounded-2xl bg-zinc-900/60 border border-white/5 space-y-3">
              <div class="flex items-center justify-between text-xs">
                <span class="text-zinc-400">Số lượng câu làm</span>
                <span class="font-medium text-white">${questionCount} câu</span>
              </div>
              <input type="range" min="5" max="100" value="${questionCount}" oninput="setCount(Number(this.value))" class="w-full accent-white h-1.5 bg-zinc-800 rounded-lg">
              <div class="flex justify-between text-[10px] text-zinc-500">
                <span>5 câu</span>
                <span>20 câu</span>
                <span>50 câu</span>
                <span>100 câu</span>
              </div>
            </div>

            <!-- Start Button -->
            <button onclick="switchScreen('quiz')" class="w-full py-3 rounded-full font-semibold text-xs text-black bg-white hover:bg-zinc-200 transition-all shadow-md">
              Bắt đầu phiên học
            </button>
          </div>
        `;
      }
      else if (currentConcept === 3) {
        // EXAM PRO (Academic / Canvas)
        vp.innerHTML = `
          <div class="space-y-4">
            <!-- Academic Title -->
            <div class="border-b border-slate-700/80 pb-2 flex items-center justify-between">
              <div>
                <h2 class="text-sm font-bold text-white uppercase tracking-wider">Hệ Thống Khảo Thí Trắc Nghiệm</h2>
                <span class="text-[10px] text-slate-400">Phiên bản trực tuyến 2026</span>
              </div>
              <span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 text-[10px] font-bold border border-blue-500/30">MÃ ĐỀ: CSDL-FE36</span>
            </div>

            <!-- Exam Mode Tabs -->
            <div class="flex border-b border-slate-800 text-xs">
              <button onclick="setMode('study')" class="px-4 py-2 font-bold transition-all ${selectedMode === 'study' ? 'border-b-2 border-blue-500 text-blue-400' : 'text-slate-400'}">
                Chế độ Ôn Luyện
              </button>
              <button onclick="setMode('exam')" class="px-4 py-2 font-bold transition-all ${selectedMode === 'exam' ? 'border-b-2 border-blue-500 text-blue-400' : 'text-slate-400'}">
                Chế độ Thi Thử (Chuẩn Đề)
              </button>
            </div>

            <!-- Info Summary Grid -->
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
